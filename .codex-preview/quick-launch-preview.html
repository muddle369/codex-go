<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CodexGO 快捷启动预览</title>
<style>
:root{color-scheme:dark;font-family:Inter,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;background:#090a13;color:#f4f4f8}
*{box-sizing:border-box}body{margin:0;min-width:900px;height:100vh;background:radial-gradient(circle at 70% 5%,#24205b 0,transparent 35%),#090a13}.shell{display:grid;grid-template-columns:208px 1fr;height:100vh}.sidebar{padding:18px 12px;border-right:1px solid #262638;background:#10111d}.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid #292a3b}.logo{width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#9b82ff,#4d8dff);display:grid;place-items:center;font-weight:800;font-size:18px;box-shadow:0 9px 24px #6b5bdb55}.brand strong{display:block;font-size:16px}.brand small{display:block;color:#9696aa;margin-top:3px}.nav{display:grid;gap:6px;margin-top:16px}.nav div{padding:11px 12px;border:1px solid transparent;border-radius:9px;color:#b9b9ca}.nav .active{border-color:#8171e8aa;background:#7160df24;color:#fff}.workspace{padding:28px 34px;overflow:auto}.topbar{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px}.topbar h1{margin:0;font-size:27px}.topbar p{margin:7px 0 0;color:#9999ad}.card{width:min(780px,100%);padding:24px;border:1px solid #33344b;border-radius:18px;background:linear-gradient(160deg,#171827f5,#121321e8);box-shadow:0 22px 70px #00000045}.status{display:flex;align-items:center;gap:12px;margin-bottom:22px}.pill{padding:5px 10px;border-radius:999px;background:#7160df27;color:#b8abff;font-size:12px}.path{color:#9999ad;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fields{display:grid;gap:14px}.field label{display:block;color:#aaaabd;font-size:12px;margin-bottom:7px}.select,.token{width:100%;height:42px;border:1px solid #37384f;border-radius:10px;background:#0d0e19;color:#f4f4f8;padding:0 12px;font-size:14px}.token{display:flex;align-items:center;justify-content:space-between}.token span{color:#d4d4e0;letter-spacing:2px}.eye{color:#a7a0da}.operations{display:grid;grid-template-columns:250px 1fr;gap:14px;margin-top:22px;align-items:stretch}.modes{display:grid;grid-template-rows:1fr 1fr;gap:8px}.mode{border:1px solid #37384f;border-radius:10px;background:#10111d;color:#c8c8d8;padding:9px 12px;text-align:left}.mode strong{display:block;font-size:13px}.mode small{display:block;margin-top:4px;color:#89899e}.mode.active{border-color:#9a86ff;background:#7768e51f;color:#fff}.launch{min-height:88px;border:1px solid #8775f3;border-radius:12px;background:linear-gradient(135deg,#7667e9,#4d78e8);color:white;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:12px 16px;font-size:15px;font-weight:700}.launch-main{display:flex;align-items:center;justify-content:center;gap:8px}.progress-row{display:flex;align-items:center;gap:8px}.progress{height:6px;flex:1;border:1px solid #fff;border-radius:999px;overflow:hidden}.progress i{display:block;width:42%;height:100%;background:#fff}.cancel{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;background:#ffffff2b;font-size:16px;font-weight:400}.note{margin-top:16px;color:#85859a;font-size:12px}
</style>
</head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><div class="logo">CG</div><div><strong>CodexGO</strong><small>管理控制台</small></div></div><div class="nav"><div class="active">🚀　快捷启动</div><div>▣　概览</div><div>🔑　供应商配置</div><div>⚙　设置</div><div>🛠　安装维护</div></div></aside><main class="workspace"><div class="topbar"><div><h1>快捷启动</h1><p>快速选择配置、启动模式并启动Codex</p></div></div><section class="card"><div class="status"><span class="pill">配置已完成</span><span class="path">/Applications/Codex.app</span></div><div class="fields"><div class="field"><label>启动配置</label><div class="select">SCD_Ai　⌄</div></div><div class="field"><label>令牌</label><div class="token"><span>••••••••••••••••••••</span><span class="eye">◉</span></div></div></div><div class="operations"><div class="modes"><button class="mode active"><strong>纯 API 模式</strong><small>只依赖令牌，适合最快启动。</small></button><button class="mode"><strong>混合 API 模式</strong><small>保留官方登录态，并混入 API Key。</small></button></div><button class="launch"><span class="launch-main">🚀　8秒后以所选配置启动Codex</span><span class="progress-row"><i class="progress"><i></i></i><span class="cancel">×</span></span></button></div><div class="note">启动模式和启动配置会应用到下一次Codex启动。</div></section></main></div></body></html>
